<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#08090d"><title>Drum Pad / Beat Maker — ANDATRA</title><link rel="icon" href="/favicon.svg"><script defer src="/access-gate.js"></script><style>
:root{color-scheme:dark;--bg:#08090d;--panel:#111218;--line:#2c2e36;--muted:#a7a9b4;--yellow:#d7ff47}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f3ee;font:16px/1.5 Arial,sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--yellow)}header{padding:20px 4vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.logo{font-size:23px;font-weight:900}nav{display:flex;gap:18px;flex-wrap:wrap}nav [aria-current]{color:var(--yellow)}main{max-width:1050px;margin:auto;padding:38px 24px}.eyebrow{color:var(--yellow);letter-spacing:2px;font-size:14px}h1{font-size:clamp(34px,6vw,64px);line-height:1;margin:10px 0 14px}.muted{color:var(--muted)}.panel{margin-top:24px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input{font:inherit}button{min-height:46px;padding:10px 15px;border:1px solid var(--line);border-radius:9px;background:#1b1d25;color:inherit;cursor:pointer}.primary{background:var(--yellow);border-color:var(--yellow);color:#08090d;font-weight:900}.record.on{background:#ff636f;color:#08090d}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.pad{aspect-ratio:1.35;min-height:90px;font-weight:900;font-size:18px;display:flex;flex-direction:column;justify-content:center}.pad small{font-weight:400;color:var(--muted)}.pad.hit{border-color:var(--yellow);transform:scale(.97)}label{color:var(--muted)}input[type=range]{accent-color:var(--yellow)}#status{margin-top:12px;color:var(--muted)}@media(max-width:650px){main{padding:25px 14px}.pads{grid-template-columns:repeat(2,1fr)}nav{font-size:14px;gap:10px}.panel{padding:16px}}
</style></head><body><header><a class="logo" href="/">ANDATRA</a><nav><a href="/studio.html">Студия</a><a href="/separate/">Отделить вокал</a><a href="/bpm/">BPM</a><a href="/drumpad/" aria-current="page">Drum Pad</a><a href="/convert/">Конвертер</a></nav></header><main><div class="eyebrow">ИНСТРУМЕНТЫ ANDATRA</div><h1>Drum Pad / Beat Maker</h1><p class="muted">Играй мышкой, пальцами или клавишами. Запиши свой ритм и зацикли его.</p><section class="panel"><div class="toolbar"><button id="record" class="record">● Запись</button><button id="play" class="primary">▶ Паттерн</button><button id="clear">Очистить</button><label>BPM <input id="bpm" type="range" min="60" max="200" value="100"> <output id="bpmOut">100</output></label></div><div id="status">Нажми «Запись», затем настучи ритм.</div><div class="pads" id="pads"></div></section></main><script>
(()=>{const defs=[['KICK','A','kick'],['SNARE','S','snare'],['CLAP','D','clap'],['HI-HAT','F','hat'],['OPEN HAT','G','open'],['808','H','bass'],['TOM','J','tom'],['RIM','K','rim']];const root=document.querySelector('#pads');let ac,rec=false,start=0,events=[],loopTimer=null;function ctx(){return ac||(ac=new AudioContext())}function sound(type){const c=ctx(),t=c.currentTime,o=c.createOscillator(),g=c.createGain(),n=c.createBufferSource(),ng=c.createGain();if(type==='kick'||type==='bass'||type==='tom'){o.type='sine';o.frequency.setValueAtTime(type==='bass'?70:type==='tom'?130:150,t);o.frequency.exponentialRampToValueAtTime(type==='bass'?42:45,t+(type==='bass'?.5:.18));g.gain.setValueAtTime(type==='bass'?.7:1,t);g.gain.exponentialRampToValueAtTime(.001,t+(type==='bass'?.65:.25));o.connect(g).connect(c.destination);o.start(t);o.stop(t+.7);return}let len=type==='open'?.35:.12,b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;let filter=c.createBiquadFilter();filter.type=type==='snare'?'bandpass':'highpass';filter.frequency.value=type==='snare'?1800:5000;ng.gain.setValueAtTime(type==='clap'?.7:.45,t);ng.gain.exponentialRampToValueAtTime(.001,t+len);n.connect(filter).connect(ng).connect(c.destination);n.start(t)}function hit(i,fromPlayback=false){sound(defs[i][2]);const b=root.children[i];b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),90);if(rec&&!fromPlayback)events.push({i,t:performance.now()-start})}defs.forEach((d,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML=d[0]+'<small>'+d[1]+'</small>';b.addEventListener('pointerdown',()=>hit(i));root.appendChild(b)});document.addEventListener('keydown',e=>{if(e.repeat)return;let i=defs.findIndex(d=>d[1]===e.key.toUpperCase());if(i>=0)hit(i)});const r=document.querySelector('#record'),p=document.querySelector('#play'),st=document.querySelector('#status');r.addEventListener('click',()=>{rec=!rec;r.classList.toggle('on',rec);r.textContent=rec?'■ Стоп записи':'● Запись';if(rec){events=[];start=performance.now();st.textContent='Запись идёт…'}else st.textContent='Записано ударов: '+events.length});function stopLoop(){if(loopTimer){clearTimeout(loopTimer);loopTimer=null}p.textContent='▶ Паттерн'}p.addEventListener('click',()=>{if(loopTimer){stopLoop();return}if(!events.length){st.textContent='Сначала запиши паттерн.';return}let bpm=+document.querySelector('#bpm').value,beat=60000/bpm,raw=Math.max(...events.map(e=>e.t),beat*4),bars=Math.max(1,Math.ceil(raw/(beat*4))),dur=bars*beat*4;const cycle=()=>{events.forEach(e=>setTimeout(()=>hit(e.i,true),e.t%dur));loopTimer=setTimeout(cycle,dur)};p.textContent='■ Остановить';cycle()});document.querySelector('#clear').addEventListener('click',()=>{stopLoop();events=[];rec=false;r.classList.remove('on');r.textContent='● Запись';st.textContent='Паттерн очищен.'});const bp=document.querySelector('#bpm'),bo=document.querySelector('#bpmOut');bp.addEventListener('input',()=>bo.textContent=bp.value)})();
</script></body></html>
